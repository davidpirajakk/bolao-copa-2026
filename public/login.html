<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa 2026 — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;min-height:100vh;background:linear-gradient(160deg,#003d1a 0%,#006b35 45%,#004d22 100%);display:flex;align-items:center;justify-content:center;padding:1rem;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='2' fill='white' fill-opacity='0.03'/%3E%3C/svg%3E");pointer-events:none}
.container{width:100%;max-width:390px;position:relative;z-index:1}
.logo-wrap{text-align:center;margin-bottom:2.25rem}
.logo{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:2px;color:white;line-height:1;text-shadow:0 4px 20px rgba(0,0,0,0.3)}
.logo span{color:#f5c518;text-shadow:0 2px 12px rgba(245,197,24,0.4)}
.logo-sub{font-size:12.5px;color:rgba(255,255,255,0.55);margin-top:6px;letter-spacing:0.8px;text-transform:uppercase}
.card{background:white;border-radius:24px;padding:2.25rem 2rem;box-shadow:0 32px 80px rgba(0,0,0,0.35),0 0 0 1px rgba(255,255,255,0.05)}
.tabs{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:2rem;gap:3px}
.tab{flex:1;padding:10px;border:none;border-radius:9px;background:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:#6b7280;cursor:pointer;transition:all 0.18s}
.tab.active{background:white;color:#006b35;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,0.1)}
.form-group{margin-bottom:1.15rem}
label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:6px;letter-spacing:0.2px;text-transform:uppercase}
input[type=text],input[type=password]{width:100%;padding:12px 15px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:15px;font-family:'DM Sans',sans-serif;color:#111827;background:#f9fafb;transition:all 0.18s}
input:focus{outline:none;border-color:#006b35;background:white;box-shadow:0 0 0 3px rgba(0,107,53,0.1)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#004d22,#007a3d);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity 0.15s;margin-top:0.4rem;box-shadow:0 4px 14px rgba(0,107,53,0.35);letter-spacing:0.2px}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.55;cursor:not-allowed}
.msg{font-size:13px;padding:11px 14px;border-radius:10px;margin-top:1rem;display:none;font-weight:500}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.msg.ok{background:#dcfce7;color:#166534;display:block}
.ball{position:fixed;pointer-events:none;user-select:none;opacity:0.06;font-size:80px;animation:float 8s ease-in-out infinite}
.ball-1{top:8%;left:5%;animation-delay:0s}
.ball-2{bottom:12%;right:5%;font-size:110px;animation-delay:-3s}
.ball-3{top:50%;right:8%;font-size:50px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(10deg)}}
</style>
</head>
<body>
<span class="ball ball-1">⚽</span>
<span class="ball ball-2">⚽</span>
<span class="ball ball-3">⚽</span>

<div class="container">
  <div class="logo-wrap">
    <div class="logo">⚽ Bolão <span>Copa 2026</span></div>
    <div class="logo-sub">EUA · México · Canadá — 11 jun a 19 jul 2026</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Entrar</button>
      <button class="tab" onclick="showTab('register')">Cadastrar</button>
    </div>

    <!-- LOGIN -->
    <div id="tab-login">
      <div class="form-group">
        <label for="loginUser">Nome de usuário</label>
        <input type="text" id="loginUser" placeholder="seu_nome" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="loginPass">Senha</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btnLogin" onclick="doLogin()">Entrar</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- REGISTER -->
    <div id="tab-register" style="display:none">
      <div class="form-group">
        <label for="regUser">Escolha um nome de usuário</label>
        <input type="text" id="regUser" placeholder="ex: joao_silva" maxlength="30" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="regPass">Senha</label>
        <input type="password" id="regPass" placeholder="mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="regPass2">Confirmar senha</label>
        <input type="password" id="regPass2" placeholder="repita a senha" autocomplete="new-password">
      </div>
      <button class="btn" id="btnRegister" onclick="doRegister()">Criar conta</button>
      <div class="msg" id="registerMsg"></div>
    </div>
  </div>
</div>

<script>
function showTab(t) {
  document.getElementById('tab-login').style.display = t === 'login' ? '' : 'none';
  document.getElementById('tab-register').style.display = t === 'register' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0) === (t === 'login'));
  });
}

async function doLogin() {
  const btn = document.getElementById('btnLogin');
  const msg = document.getElementById('loginMsg');
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  msg.className = 'msg'; msg.textContent = '';
  if (!username || !password) { showMsg(msg, 'Preencha todos os campos.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (r.ok) { window.location.href = '/app'; }
    else { showMsg(msg, d.error || 'Erro ao entrar.', 'err'); }
  } catch { showMsg(msg, 'Erro de conexão.', 'err'); }
  btn.disabled = false; btn.textContent = 'Entrar';
}

async function doRegister() {
  const btn = document.getElementById('btnRegister');
  const msg = document.getElementById('registerMsg');
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  msg.className = 'msg'; msg.textContent = '';
  if (!username || !password || !password2) { showMsg(msg, 'Preencha todos os campos.', 'err'); return; }
  if (password.length < 6) { showMsg(msg, 'A senha deve ter pelo menos 6 caracteres.', 'err'); return; }
  if (password !== password2) { showMsg(msg, 'As senhas não coincidem.', 'err'); return; }
  btn.disabled = true; btn.textContent = 'Criando conta...';
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (r.ok) { window.location.href = '/app'; }
    else { showMsg(msg, d.error || 'Erro ao criar conta.', 'err'); }
  } catch { showMsg(msg, 'Erro de conexão.', 'err'); }
  btn.disabled = false; btn.textContent = 'Criar conta';
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg ' + type;
}

// Allow Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginVisible = document.getElementById('tab-login').style.display !== 'none';
    if (loginVisible) doLogin(); else doRegister();
  }
});
</script>
</body>
</html>
